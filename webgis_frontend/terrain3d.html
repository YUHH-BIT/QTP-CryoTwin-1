  <!-- Three.js 本地托管（js/lib/，npm 包解出，非 CDN）。不使用 importmap：
       OrbitControls 已改为相对路径 import './three.module.js'，
       少一层解析、也少一类"映射没生效就整页不跑"的故障。 -->
  <style>
    /* 三维示范区：系统导航区保持原样，内容区改为内嵌吉隆灾害链演示页。
       导航占 --nav-height(120px)，iframe 铺满其余视口。 */
    html, body { margin: 0; height: 100%; background: #070b14; overflow: hidden; }
    #demo-frame {
      display: block; width: 100%;
      height: calc(100vh - var(--nav-height));
      border: 0; background: #070b14;
    }
    /* 导航脚本里的 searchHint() 会找 #status；保留一个隐藏承载元素，
       避免替换内容区后导航行为变化。 */
    #status { display: none; }
    #demo-error {
      display: none; position: fixed; z-index: 90;
      top: calc(var(--nav-height) + 12px); left: 16px; right: 16px;
      padding: 10px 14px; border-radius: 8px;
      background: rgba(127, 29, 29, .92); color: #fecaca;
      font: 13px/1.5 -apple-system, "Microsoft YaHei", sans-serif;
    }
  </style>
</head>

<script>
// 下拉菜单交互（与 main.js 中 initUnifiedDropdowns 行为一致，本页独立实现）
(function () {
  document.querySelectorAll('.dropdown-toggle').forEach(function (t) {
    t.addEventListener('click', function (e) {
      e.preventDefault();
      e.stopPropagation();
      var menu = t.nextElementSibling;
      document.querySelectorAll('.dropdown-menu.active').forEach(function (m) {
        if (m !== menu) m.classList.remove('active');
      });
      if (menu) menu.classList.toggle('active');
    });
  });
  document.addEventListener('click', function (e) {
    if (!e.target.closest('.dropdown-container')) {
      document.querySelectorAll('.dropdown-menu.active').forEach(function (m) {
        m.classList.remove('active');
      });
    }
  });

  // 搜索框：本页是三维地形视图，不做二维地图的地名定位。
  // 与其"点了没反应"，不如给一句明确说明。
  var input = document.getElementById('place-search');
  var btn = document.getElementById('search-btn');
  function searchHint() {
    var el = document.getElementById('status');
    if (el) {
      el.innerHTML = '<span class="err">三维示范区当前仅覆盖雅鲁藏布江流域（按流域边界裁剪）；' +
        '地名搜索请在二维地图页面使用。</span>';
    }
  }
  if (btn) {
    btn.addEventListener('click', function () {
      if (input && input.value.trim() === '') { input.focus(); return; }
      searchHint();
    });
  }
  if (input) {
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') searchHint();
    });
  }
})();
</script>

<!-- 内容区：吉隆「8·26」冰岩崩—泥石流灾害链三维推演（内嵌演示页）。
     演示页本体在 terrain3d/demo/，由已有的 /terrain3d/<path> 路由提供；
     Cesium 子视图用的 /cesium_lib/、/tiles/、/models/ 也已有后端路由。 -->
<span id="status" aria-hidden="true"></span>
<div id="demo-error" role="alert"></div>
<iframe id="demo-frame"
        src="/terrain3d/demo/index.html?embedded=1"
        title="吉隆 8·26 冰岩崩—泥石流灾害链三维推演"
        allow="fullscreen" loading="eager"></iframe>
<script>
// 内嵌容错：只有真的加载不出来才显示一行提示，正常时不出现任何画布文字。
(function () {
  var f = document.getElementById('demo-frame');
  var box = document.getElementById('demo-error');
  var done = false;
  function fail(msg) {
    if (done || !box) return;
    box.textContent = msg;
    box.style.display = 'block';
  }
  f.addEventListener('load', function () { done = true; });
  f.addEventListener('error', function () {
    fail('三维演示页加载失败，请确认已启动 Flask（http://127.0.0.1:5000/terrain3d.html）。');
  });
  setTimeout(function () {
    try {
      if (!f.contentWindow || !f.contentWindow.document) fail('三维演示页未响应。');
    } catch (e) { /* 跨域时无法检查，正常同源不会走到这里 */ }
  }, 12000);
})();
</script>
</body>
</html>
