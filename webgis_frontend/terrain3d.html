<script>
// 下拉菜单交互（与 main.js 中 initUnifiedDropdowns 行为一致，本页独立实现）
(function () {
  document.querySelectorAll('.dropdown-toggle').forEach(function (t) {
    t.addEventListener('click', function (e) {
      e.preventDefault();
      e.stopPropagation();
      var menu = t.nextElementSibling;
      document.querySelectorAll('.dropdown-menu.active').forEach(function (m) {
        if (m !== menu) m.classList.remove('active');
      });
      if (menu) menu.classList.toggle('active');
    });
  });
  document.addEventListener('click', function (e) {
    if (!e.target.closest('.dropdown-container')) {
      document.querySelectorAll('.dropdown-menu.active').forEach(function (m) {
        m.classList.remove('active');
      });
    }
  });

  // 搜索框：本页是三维地形视图，不做二维地图的地名定位。
  // 与其"点了没反应"，不如给一句明确说明。
  var input = document.getElementById('place-search');
  var btn = document.getElementById('search-btn');
  function searchHint() {
    var el = document.getElementById('status');
    if (el) {
      el.innerHTML = '<span class="err">三维示范区当前仅覆盖雅鲁藏布江流域（按流域边界裁剪）；' +
        '地名搜索请在二维地图页面使用。</span>';
    }
  }
  if (btn) {
    btn.addEventListener('click', function () {
      if (input && input.value.trim() === '') { input.focus(); return; }
      searchHint();
    });
  }
  if (input) {
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') searchHint();
    });
  }
})();
</script>

<!-- 内容区：吉隆「8·26」冰岩崩—泥石流灾害链三维推演（内嵌演示页）。
     演示页本体在 terrain3d/demo/，由已有的 /terrain3d/<path> 路由提供；
     Cesium 子视图用的 /cesium_lib/、/tiles/、/models/ 也已有后端路由。 -->
<span id="status" aria-hidden="true"></span>
<div id="demo-error" role="alert"></div>
<iframe id="demo-frame"
        src="/terrain3d/demo/index.html?embedded=1&v=20261117a"
        title="吉隆 8·26 冰岩崩—泥石流灾害链三维推演"
        allow="fullscreen" loading="eager"></iframe>
<script>
// 内嵌容错：只有真的加载不出来才显示一行提示，正常时不出现任何画布文字。
(function () {
  var f = document.getElementById('demo-frame');
  var box = document.getElementById('demo-error');
  var ov = document.getElementById('loading-overlay');
  var shown = false;        // 错误条只显示一次
  var frameLoaded = false;  // iframe 的 load 是否已触发（给 12 s 探活用）
  function fail(msg) {
    if (shown || !box) return;
    shown = true;
    box.textContent = msg;
    box.style.display = 'block';
  }
  function hideOverlay() {
    if (ov) ov.classList.remove('active');
  }
  f.addEventListener('load', function () { frameLoaded = true; });
  f.addEventListener('error', function () {
    fail('三维演示页加载失败，请确认已启动 Flask（http://127.0.0.1:5000/terrain3d.html）。');
    hideOverlay();
  });
  setTimeout(function () {
    try {
      if (!f.contentWindow || !f.contentWindow.document) {
        fail('三维演示页未响应。');
        hideOverlay();
      }
    } catch (e) { /* 跨域时无法检查，正常同源不会走到这里 */ }
  }, 12000);

  /* 加载动效的收尾：等内嵌场景**真的就绪**才撤遮罩。
     不能用 iframe 的 load 事件 —— 那只是 index.html 的 DOM 到了，
     之后还要下 DEM 高度场、21 MB 卫星影像、沟道/场数据并建好 Three.js 场景；
     也不能按固定秒数硬等（机器快慢差好几倍）。
     demo/app.js 的 boot() 结尾会置 window.__ready = true，这里轮询它，
     同源读取，不依赖任何后端改造。 */
  var t0 = Date.now();
  var hideTimer = null;
  (function waitReady() {
    if (hideTimer) return;
    var win = null;
    try { win = f.contentWindow; } catch (e) { win = null; }
    if (win && win.__err) {
      // 场景真跑挂了：别让遮罩一直盖着，露出错误条
      fail('三维场景初始化失败：' + String(win.__err));
      hideOverlay();
      return;
    }
    if (win && win.__ready) {
      // __ready 是在 requestAnimationFrame(loop) 之前置的，等一帧再加一点余量，
      // 让首帧真正画出来再淡出，避免"遮罩撤了看到一块黑"。
      hideTimer = setTimeout(hideOverlay, 260);
      return;
    }
    var el = Date.now() - t0;
    if (!frameLoaded && el > 20000) {
      // 20 s 连 index.html 的 load 都没触发：基本是后端/路由没起
      fail('三维演示页加载失败，请确认已启动 Flask（http://127.0.0.1:5000/terrain3d.html）。');
      hideOverlay();
      return;
    }
    if (el > 90000) { hideOverlay(); return; }  // 兜底：软件渲染等极慢情况也不无限挂着
    setTimeout(waitReady, 150);
  })();
})();
</script>
