<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>登录 - 青藏高原冰冻圈灾害数字孪生系统</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico?v=20261111b" />
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0b3d6b 0%, #1b5e9e 55%, #2c7bb6 100%);
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    }
    .login-card {
      width: 380px;
      max-width: 92vw;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
      padding: 36px 32px 24px;
      text-align: center;
    }
    .login-title { margin: 0 0 6px; font-size: 20px; color: #0b3d6b; }
    .login-sub { margin: 0 0 24px; font-size: 13px; color: #888; }
    .login-field { margin-bottom: 16px; text-align: left; }
    .login-field label { display: block; margin-bottom: 6px; font-size: 13px; color: #555; }
    .login-field input {
      width: 100%;
      height: 38px;
      padding: 0 10px;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
    }
    .login-field input:focus { border-color: #2c7bb6; box-shadow: 0 0 0 2px rgba(44,123,182,.15); }
    .login-error { color: #d7191c; font-size: 13px; margin-bottom: 12px; }
    .login-btn {
      width: 100%;
      height: 40px;
      border: none;
      border-radius: 6px;
      background: #2c7bb6;
      color: #fff;
      font-size: 15px;
      cursor: pointer;
    }
    .login-btn:hover { background: #1b5e9e; }
    .login-btn:disabled { opacity: .6; cursor: not-allowed; }
    .login-back { margin-top: 16px; font-size: 13px; }
    .login-back a { color: #2c7bb6; text-decoration: none; }
    .login-hint { margin-top: 8px; font-size: 12px; color: #aaa; }
  </style>
</head>
<body>
  <div class="login-card">
    <h2 class="login-title">青藏高原冰冻圈灾害数字孪生系统</h2>
    <p class="login-sub">仅系统管理功能需要登录</p>
    <form id="login-form" autocomplete="off">
      <div class="login-field">
        <label for="username">用户名</label>
        <input type="text" id="username" name="username" required autofocus />
      </div>
      <div class="login-field">
        <label for="password">密码</label>
        <input type="password" id="password" name="password" required />
      </div>
      <div class="login-error" id="login-error" style="display:none;"></div>
      <button type="submit" id="login-btn" class="login-btn">登 录</button>
    </form>
    <p class="login-back"><a href="index.html">&larr; 返回首页</a></p>
    <p class="login-hint">默认账号由管理员在 .env 中配置</p>
  </div>
  <script src="js/login.js"></script>
</body>
</html>
