  <!-- 后台页不引入 main.js（那是地图初始化），顶栏下拉在这里内置一份等价逻辑 -->
  <script>
    (function () {
      'use strict';
      document.querySelectorAll('.dropdown-toggle').forEach(function (t) {
        t.addEventListener('click', function (e) {
          e.preventDefault();
          e.stopPropagation();
          var menu = t.nextElementSibling;
          if (!menu) return;
          var wasOpen = menu.classList.contains('active');
          document.querySelectorAll('.dropdown-menu.active').forEach(function (m) { m.classList.remove('active'); });
          if (!wasOpen) menu.classList.add('active');
        });
      });
      document.addEventListener('click', function () {
        document.querySelectorAll('.dropdown-menu.active').forEach(function (m) { m.classList.remove('active'); });
      });
      document.addEventListener('keydown', function (e) {
        if (e.key !== 'Escape') return;
        document.querySelectorAll('.dropdown-menu.active').forEach(function (m) { m.classList.remove('active'); });
      });
      // 当前页就是后台，隐藏「系统管理」相关的旧高亮入口
      var page = window.location.pathname.split('/').pop();
      document.querySelectorAll('.dropdown-menu .dropdown-item').forEach(function (item) {
        var href = item.getAttribute('href') || '';
        if (href.indexOf('?') !== -1) return;
        if (href.split('/').pop() === page) item.classList.add('active');
      });
    })();
  </script>
